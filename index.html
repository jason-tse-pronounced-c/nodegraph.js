<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>nodegraph demo</title>
  <style>
    html, body { margin: 0; height: 100%; }
    #app { position: absolute; inset: 0; }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    import { createGraph } from './nodegraph.js';

    const graph = createGraph(document.getElementById('app'));

    // starter graph
    const a = graph.addNode({ x: 80, y: 120, label: 'Source', params: [{ name: 'value' }] });
    const b = graph.addNode({ x: 380, y: 120, label: 'Process', params: [{ name: 'input' }, { name: 'result' }] });
    const c = graph.addNode({ x: 680, y: 120, label: 'Sink', params: [{ name: 'input' }] });
    const e1 = graph.connect({ node: a.id, param: a.params[0].id }, { node: b.id, param: b.params[0].id });
    graph.connect({ node: b.id, param: b.params[1].id }, { node: c.id, param: c.params[0].id });
    graph.setEdgeLabel(e1.id, 'data');

    // A group is a labelled rectangle drawn underneath the nodes, with a solid
    // double border and a light tinted fill (right-click → Group colour to
    // tint it). Membership is geometric (a node belongs while its centre is
    // inside the box), so dragging the group carries Source + Process along
    // together. Right-click the canvas for "Add group here"; drag a group's
    // body to move it, its corner grip to resize, or double-click its label to
    // rename. Everything snaps to the grid.
    graph.addGroup({ x: 60, y: 100, w: 540, h: 140, label: 'Pipeline', color: '#8250df' });
  </script>
</body>
</html>
